# Drop into /etc/nginx/sites-available/ and symlink.
# Replace example.com. Existing apps keep their own server blocks.

# ProStock
server {
    listen 80;
    server_name stocks.example.com;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}

# n8n editor (keep behind auth)
server {
    listen 80;
    server_name n8n.example.com;
    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# Do NOT proxy Ollama to the public internet.
# n8n and ProStock reach it as http://ollama:11434
# Other apps on the host: http://127.0.0.1:11434
