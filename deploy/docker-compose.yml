# Portable stack: FastAPI + n8n + Ollama. No host venv required.
# From repo:  ./scripts/dev_local.sh
# From here:  cp .env.example .env && docker compose up -d --build

name: prostock-local

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://127.0.0.1:5678/}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-local-dev-only-change-later}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-nemotron-3-ultra:cloud}
      - PROSTOCK_URL=${PROSTOCK_URL:-http://prostock:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 1g
    depends_on:
      - ollama
    networks: [apps]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    env_file:
      - .env
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 2g
    cpus: 2.0
    networks: [apps]

  prostock:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROSTOCK_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-nemotron-3-ultra:cloud}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/prostock-brief
      - NLP_TIMEOUT=180
    volumes:
      - ../pro_model.h5:/app/pro_model.h5:ro
      - ../pro_scaler.pkl:/app/pro_scaler.pkl:ro
      - ../model_metrics.json:/app/model_metrics.json:ro
      - ../logs:/app/logs
    mem_limit: 3g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
      - n8n
    networks: [apps]

volumes:
  n8n_data:
  ollama_data:

networks:
  apps:
    name: prostock-local
